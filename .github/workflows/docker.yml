name: Automated Docker Deployment Workflow

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t automated-website .

      - name: Stop old container
        shell: powershell
        run: |
          docker stop automated-website-container
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Container was not running."
          }

      - name: Remove old container
        shell: powershell
        run: |
          docker rm automated-website-container
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Container does not exist."
          }

      - name: Run new container
        run: docker run -d --name automated-website-container -p 8080:80 automated-website